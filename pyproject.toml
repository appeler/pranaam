[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "pranaam"
version = "0.8.0"
description = "Calibrated name-pattern estimates for aggregate research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "Natural Language :: English",
  "Natural Language :: Hindi"
]
keywords = ["name-pattern", "calibration", "aggregate-research", "hindi", "english", "machine-learning", "deep-learning", "nlp", "name-classification", "pytorch", "hugging-face"]
dependencies = [
  "huggingface-hub>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "rich>=13.0.0",
  "safetensors>=0.5",
  "torch>=2.7",
]
[project.optional-dependencies]
streamlit = [
    "streamlit>=1.20",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
    "pre-commit>=4",
    "deptry>=0.24",
    "pandas-stubs>=2.0",
    { include-group = "test" },
]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3.0",
    "streamlit>=1.20",
]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]
train = [
    "pyarrow>=18,<25",
]

[project.urls]
"Homepage" = "https://github.com/appeler/pranaam"
"Repository" = "https://github.com/appeler/pranaam"
"Bug Tracker" = "https://github.com/appeler/pranaam/issues"

[project.scripts]
pranaam = "pranaam.pranaam:main"

[[project.authors]]
name = "Rajashekar Chintalapati"
email = "rajshekar.ch@gmail.com"

[[project.authors]]
name = "Aaditya Dar"

[[project.authors]]
name = "Gaurav Sood"
email = "gsood07@gmail.com"

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=pranaam",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (requires model download)",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests with real models"
]



[tool.coverage.run]
source = ["pranaam"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "model_training/",
    "scripts/",
    "docs/",
    "**/*.ipynb",
]

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]
"pranaam/pranaam.py" = ["T201"]
"streamlit/run_app.py" = ["S603", "T201"]
"*.ipynb" = ["E402", "E722", "UP031", "B905", "F821", "F811", "W293", "F841"]  # ignore notebook linting issues

[tool.ruff.lint.isort]
known-first-party = ["pranaam"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.deptry]
ignore_notebooks = true
extend_exclude = [
    "docs/examples/*.ipynb",
    "model_training/*.ipynb",
    "scripts/",
    "streamlit/requirements.txt",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["sphinx", "furo", "sphinx-copybutton", "myst-parser", "streamlit"]
DEP003 = ["pranaam"]
DEP004 = ["py_canon"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
arg-type-hints-in-signature = true
check-yield-types = true
skip-checking-raises = false
require-return-section-when-returning-nothing = false


[tool.pyright]
include = ["pranaam"]
typeCheckingMode = "standard"

[tool.preen]
src_layout = false

[tool.uv.build-backend]
module-name = "pranaam"
module-root = ""
source-include = [
    "CHANGELOG.md",
    "Citation.cff",
    "Makefile",
    "docs/**",
    "model_training/**",
    "scripts/**",
    "streamlit/**",
    "tests/**",
    "training/**",
    "uv.lock",
]
